name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The release line is integration, and CI does not run on pushes to it. That
  # left the branch that actually ships with no way to be verified in CI at all,
  # so a release could only ever rest on someone's local run.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -cover ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
  fuzz:
    # The strict decoders' guards (a duplicate key written in two forms, a
    # surrogate pair, a slot found twice) are held by deterministic tests in
    # the go job and by these fuzz targets, each run for 30 seconds against
    # the encoding/json behaviour it stands in for. -fuzz takes one target in
    # one package, so every Fuzz function go test -list finds runs on its own,
    # and a new target is picked up without a workflow change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          check-latest: true
      - name: run every fuzz target for 30s
        run: |
          found=0
          for pkg in $(go list ./...); do
            names=$(go test -list '^Fuzz' "$pkg")
            for name in $(printf '%s\n' "$names" | grep '^Fuzz' || true); do
              found=1
              echo "fuzzing $name in $pkg"
              go test -run '^$' -fuzz "^${name}\$" -fuzztime 30s "$pkg"
            done
          done
          if [ "$found" = 0 ]; then echo "no Fuzz targets found" && exit 1; fi
